# Demo profile for the built-in users/schemas feature:
#   cd example-app && ../mvnw spring-boot:run -Dspring-boot.run.profiles=users
# The bootstrap admin is created once, when sql_users is still empty. Change the
# password after the first login — these credentials are public.
db-scheduler-ui.users.enabled=true
db-scheduler-ui.users.bootstrap-username=admin
db-scheduler-ui.users.bootstrap-password=admin
